# Version catalog for the Greenfield5 Android shell.
# Every pin and its primary-source evidence: docs/decisions/0006-application-stack.md.

[versions]
# Android Gradle Plugin — current stable (September 2026), AGP 9 built-in Kotlin.
agp = "9.4.0"
# Kotlin / Compose compiler plugin — current stable Kotlin (2026-09-07).
kotlin = "2.4.20"
# Compose BOM — latest per developer.android.com (maps compose libs 1.12.0, material3 1.4.0).
composeBom = "2026.08.00"
# androidx.activity (activity-compose) — current stable.
activityCompose = "1.13.0"
# JVM unit tests.
junit = "4.13.2"
# Android 17 = API 37 (stable since 2026-06-16); AGP 9.4 supports up to API 37.
compileSdk = "37"
targetSdk = "37"
# PRODUCT.md §11: Android 10+ floor.
minSdk = "29"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
