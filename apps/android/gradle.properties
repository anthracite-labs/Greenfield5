# Project-wide Gradle settings.
#
# AGP 9 defaults are deliberately NOT re-declared here (android.useAndroidX,
# android.builtInKotlin, android.newDsl, ... are defaults now; some are even
# rejected). See docs/decisions/0006-application-stack.md.

# JVM arguments for the Gradle daemon (local and CI).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style.
kotlin.code.style=official
