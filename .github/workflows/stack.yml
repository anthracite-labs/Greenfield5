# Stack CI for the application tree (ADR-0006, ADR-0007).
#
# Runs ALONGSIDE — never instead of — the foundation gate in verify.yml.
# The required status contexts stay exactly the two defined in
# config/main-ruleset.json ("Foundation gate", "Independent checks"); this
# workflow is deliberately non-required until the stack stabilizes
# (ADR-0006 follow-up 8). iOS job added in Issue #15 to provide honest
# verification for the native↔Rust bridge.
name: Stack

on:
  push:
    branches: [main]
    paths:
      - core/**
      - apps/android/**
      - apps/ios/**
      - .github/workflows/stack.yml
  pull_request:
    paths:
      - core/**
      - apps/android/**
      - apps/ios/**
      - .github/workflows/stack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # core/rust-toolchain.toml pins the exact toolchain (1.98.1) and
      # components; the runner's rustup installs it on first use. No
      # third-party toolchain action means no extra supply-chain surface.
      - name: Show pinned toolchain
        run: |
          rustup show
          cargo --version
          rustc --version

      # On failure each step publishes its output as a check-run annotation:
      # annotations stay readable through api.github.com even where raw log
      # blob storage is unreachable for a reviewer/agent. The heredoc body is
      # flush-left on purpose (bash column 0, Python module level).
      - name: Format
        run: |
          set -euo pipefail
          if ! cargo fmt --check >/tmp/fmt.diff 2>&1; then
            python3 - /tmp/fmt.diff 'cargo fmt --check diff' <<'PY'
          import sys
          path, title = sys.argv[1], sys.argv[2]
          data = open(path, 'rb').read().decode('utf-8', 'replace')[:60000]
          enc = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          title_enc = title.replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
          print(f'::error title={title_enc}::{enc}')
          PY
            exit 1
          fi

      - name: Lint
        run: |
          set -euo pipefail
          if ! cargo clippy --all-targets -- -D warnings >/tmp/clippy.txt 2>&1; then
            echo "---- clippy.txt size $(wc -c </tmp/clippy.txt) ----"
            echo "---- tail 200 ----"
            tail -n 200 /tmp/clippy.txt || true
            echo "---- end tail ----"
            python3 - /tmp/clippy.txt 'cargo clippy tail200' <<'PY'
          import sys, subprocess, pathlib
          path,title=sys.argv[1],sys.argv[2]
          # last 200 lines, limited to 4000 chars to fit GH annotation limit
          try:
              out=subprocess.check_output(['tail','-n','200',path], text=True, errors='replace')
          except Exception as e:
              out=f'tail failed: {e}\n'+pathlib.Path(path).read_text(errors='replace')[-4000:]
          data=out[-4000:]
          enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          t=title.replace('%','%25').replace(':','%3A').replace(',','%2C')
          print(f'::error title={t}::{enc}')
          PY
            python3 - /tmp/clippy.txt 'cargo clippy findings tail' <<'PY'
          import sys
          path, title = sys.argv[1], sys.argv[2]
          data = open(path, 'rb').read().decode('utf-8', 'replace')[-60000:]
          enc = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          title_enc = title.replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
          print(f'::error title={title_enc}::{enc}')
          PY
            python3 - /tmp/clippy.txt 'cargo clippy findings head' <<'PY'
          import sys
          path, title = sys.argv[1], sys.argv[2]
          data = open(path, 'rb').read().decode('utf-8', 'replace')[:60000]
          enc = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          title_enc = title.replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
          print(f'::error title={title_enc}::{enc}')
          PY
            exit 1
          fi

      - name: Test
        run: |
          set -euo pipefail
          if ! cargo test >/tmp/test.txt 2>&1; then
            python3 - /tmp/test.txt 'cargo test output' <<'PY'
          import sys
          path, title = sys.argv[1], sys.argv[2]
          data = open(path, 'rb').read().decode('utf-8', 'replace')[-60000:]
          enc = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          title_enc = title.replace('%', '%25').replace(':', '%3A').replace(',', '%2C')
          print(f'::error title={title_enc}::{enc}')
          PY
            exit 1
          fi

  android-shell:
    name: Android shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Rust toolchain (for UniFFI bridge)
        working-directory: core
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Install cargo-ndk
        working-directory: core
        run: |
          cargo install cargo-ndk --version 3.5.4 --locked || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Set up Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ndk;28.0.12916984

      - name: Build Rust core for Android (arm64 + x86_64 for CI)
        working-directory: core
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12916984
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.0.12916984
          NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12916984
        run: |
          set -euo pipefail
          echo \"NDK env: ANDROID_NDK_HOME=$ANDROID_NDK_HOME ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT\"
          rustup target add aarch64-linux-android x86_64-linux-android
          if ! cargo ndk -t arm64-v8a -t x86_64 --platform 29 -o ../apps/android/app/src/main/jniLibs build --release >/tmp/android-ndk.txt 2>&1; then
            echo \"---- android-ndk.txt size $(wc -c </tmp/android-ndk.txt) ----\"
            tail -n 200 /tmp/android-ndk.txt || true
            python3 - /tmp/android-ndk.txt 'Android cargo ndk tail200' <<'PY'
          import subprocess, pathlib, sys
          path,title=sys.argv[1],sys.argv[2]
          try:
              out=subprocess.check_output(['tail','-n','200',path], text=True, errors='replace')
          except Exception as e:
              out=f'tail failed: {e}\n'+pathlib.Path(path).read_text(errors='replace')[-4000:]
          data=out[-4000:]
          enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          t=title.replace('%','%25').replace(':','%3A').replace(',','%2C')
          print(f'::error title={t}::{enc}')
          PY
            python3 - /tmp/android-ndk.txt 'Android cargo ndk build' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
            exit 1
          fi
          ls -R ../apps/android/app/src/main/jniLibs

      - name: Generate Kotlin bindings via UniFFI
        working-directory: core
        run: |
          set -euo pipefail
          if ! cargo build --release >/tmp/android-host-build.txt 2>&1; then cat /tmp/android-host-build.txt; python3 - /tmp/android-host-build.txt 'Android host build' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          if ! cargo run --bin uniffi-bindgen generate --library target/release/libgreenfield5_core.so --language kotlin --out-dir ../apps/android/app/src/main/java/ >/tmp/android-bindgen.txt 2>&1; then cat /tmp/android-bindgen.txt; python3 - /tmp/android-bindgen.txt 'Android Kotlin bindgen' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          ls -R ../apps/android/app/src/main/java/uniffi || true
          echo "Generated Kotlin bindings:"
          find ../apps/android/app/src/main/java/uniffi -type f -print 2>&1 | head -n 20 || true

      # The wrapper properties pin Gradle 9.6.1 with its SHA-256 checksum;
      # AGP 9.4.0 / Kotlin 2.4.20 pins live in gradle/libs.versions.toml.
      - name: Unit tests and debug assembly (with Rust bridge)
        run: |
          set -euo pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon >/tmp/android-gradle-debug.txt 2>&1; then cat /tmp/android-gradle-debug.txt; tail -n 300 /tmp/android-gradle-debug.txt; python3 - /tmp/android-gradle-debug.txt 'Android gradle debug' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi

      - name: Release assembly (proves R8 keep rules)
        run: |
          set -euo pipefail
          if ! ./gradlew assembleRelease --stacktrace --no-daemon >/tmp/android-gradle-release.txt 2>&1; then cat /tmp/android-gradle-release.txt; tail -n 300 /tmp/android-gradle-release.txt; python3 - /tmp/android-gradle-release.txt 'Android gradle release' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi

  ios-shell:
    name: iOS shell
    runs-on: macos-15
    # ADR-0006 requires Xcode 16+ (objectVersion 77, Swift 6.0). macos-14 default
    # is Xcode 15.4 / Swift 5.10 / SDK 17.5 (observed in run 34962440056), which
    # does not match the committed project. macos-15 default is Xcode 16.0 per
    # https://github.com/actions/runner-images/issues/11486, compatible with Swift 6.
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Xcode version
        run: |
          echo "Available Xcode installations:"
          ls -1 /Applications/Xcode*.app 2>&1 || true
          echo "Selecting compatible Xcode (ADR-0006: objectVersion 77 = Xcode 16+, modeled on Xcode 16/26): prefer Xcode 26.x if available, fallback to 16.x"
          # macos-15 runner has Xcode 26 installations available per observed env; previous job reported Xcode 16.2 active.
          # We explicitly select the newest compatible version to ensure xcodebuild verification uses the recorded toolchain decision.
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            echo "No known Xcode version found, using system default"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          swift --version

      - name: Show Rust toolchain (for UniFFI bridge)
        working-directory: core
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Install Rust iOS targets
        working-directory: core
        run: |
          set -euo pipefail
          # macos-14 is aarch64; x86_64-apple-ios-sim not supported on 1.98.1-aarch64-apple-darwin toolchain (run 34962440056)
          if ! rustup target add aarch64-apple-ios aarch64-apple-ios-sim >/tmp/ios-targets.txt 2>&1; then cat /tmp/ios-targets.txt; python3 - /tmp/ios-targets.txt 'iOS rustup target add' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          cat /tmp/ios-targets.txt

      - name: Build Rust core for iOS (staticlib)
        working-directory: core
        run: |
          set -euo pipefail
          if ! cargo build --release --target aarch64-apple-ios >/tmp/ios-build-aarch64.txt 2>&1; then cat /tmp/ios-build-aarch64.txt; python3 - /tmp/ios-build-aarch64.txt 'iOS aarch64 build' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          if ! cargo build --release --target aarch64-apple-ios-sim >/tmp/ios-build-sim-arm.txt 2>&1; then cat /tmp/ios-build-sim-arm.txt; python3 - /tmp/ios-build-sim-arm.txt 'iOS sim arm64 build' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          ls -lh target/*/release/libgreenfield5_core.a

      - name: Generate Swift bindings via UniFFI
        working-directory: core
        run: |
          set -euo pipefail
          # Clean up old placeholder that caused ambiguous type errors (greenfield5.swift vs greenfield5_core.swift)
          # Real UniFFI generates greenfield5_core.swift + FFI header/modulemap; placeholder must match that name.
          rm -f ../apps/ios/Greenfield5/Bridge/Generated/greenfield5.swift
          rm -rf ../apps/ios/Greenfield5/Bridge/Generated/headers
          rm -rf ../apps/ios/Greenfield5/Bridge/Generated/Greenfield5Core.xcframework
          rm -rf target/xcframework-headers
          if ! cargo build --release >/tmp/ios-host-build.txt 2>&1; then cat /tmp/ios-host-build.txt; python3 - /tmp/ios-host-build.txt 'iOS host cdylib build' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          if ! cargo run --bin uniffi-bindgen generate --library target/release/libgreenfield5_core.dylib --language swift --out-dir ../apps/ios/Greenfield5/Bridge/Generated/ >/tmp/ios-bindgen.txt 2>&1; then cat /tmp/ios-bindgen.txt; python3 - /tmp/ios-bindgen.txt 'iOS Swift bindgen' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          # Ensure only one Swift file defines the API — delete old greenfield5.swift if bindgen created greenfield5_core.swift and left old file
          if [ -f "../apps/ios/Greenfield5/Bridge/Generated/greenfield5_core.swift" ] && [ -f "../apps/ios/Greenfield5/Bridge/Generated/greenfield5.swift" ]; then
            echo "Both greenfield5.swift and greenfield5_core.swift exist after generation — removing old greenfield5.swift to avoid ambiguous types"
            rm -f ../apps/ios/Greenfield5/Bridge/Generated/greenfield5.swift
          fi
          find ../apps/ios/Greenfield5/Bridge/Generated -type f -print 2>&1 || true

      - name: Generate XCFramework
        working-directory: apps/ios
        run: |
          set -euo pipefail
          chmod +x scripts/generate-xcframework.sh || true
          if ! ./scripts/generate-xcframework.sh >/tmp/ios-xcf.txt 2>&1; then cat /tmp/ios-xcf.txt; python3 - /tmp/ios-xcf.txt 'iOS XCFramework' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
          exit 1; fi
          echo "XCFramework generated, listing:"
          find Greenfield5/Bridge/Generated -type f -print 2>&1 || true

      - name: Build iOS app (simulator)
        run: |
          set -euo pipefail
          echo "Available destinations for Greenfield5 scheme:"
          xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -showdestinations || true
          echo "Simctl devices:"
          xcrun simctl list devices available 2>&1 | head -n 100 || true
          # Try multiple destinations: iPhone 16 (Xcode 16.2), iPhone 15 fallback, generic simulator
          # Xcode 26 on macos-15 may not have iPhone 16 with OS=latest, use generic or Any device
          set +e
          xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' -configuration Debug build CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-build.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "iPhone 16 latest failed (rc=$rc), trying iPhone 16 without OS..."
            xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 16' -configuration Debug build CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-build.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "iPhone 16 without OS failed (rc=$rc), trying iPhone 15..."
            xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -configuration Debug build CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-build.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "iPhone 15 latest failed (rc=$rc), trying generic iOS Simulator..."
            xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'generic/platform=iOS Simulator' -configuration Debug build CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-build.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "generic/platform=iOS Simulator failed (rc=$rc), trying Any iOS Simulator Device..."
            xcodebuild -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' -configuration Debug build CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-build.txt 2>&1
            rc=$?
          fi
          set -e
          cat /tmp/ios-xcode-build.txt
          if [ $rc -ne 0 ]; then
            tail -n 200 /tmp/ios-xcode-build.txt
            python3 - /tmp/ios-xcode-build.txt 'iOS xcodebuild' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
            exit 1
          fi
          tail -n 100 /tmp/ios-xcode-build.txt

      - name: Run iOS tests
        run: |
          set -euo pipefail
          echo "Running iOS tests with fallback destinations..."
          set +e
          xcodebuild test -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' -configuration Debug CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-test.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "iPhone 16 latest test failed (rc=$rc), trying iPhone 16 without OS..."
            xcodebuild test -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 16' -configuration Debug CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-test.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "iPhone 16 without OS test failed (rc=$rc), trying iPhone 15..."
            xcodebuild test -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -configuration Debug CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-test.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "iPhone 15 latest test failed (rc=$rc), trying generic..."
            xcodebuild test -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-test.txt 2>&1
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "generic test failed (rc=$rc), trying Any iOS Simulator Device..."
            xcodebuild test -project Greenfield5.xcodeproj -scheme Greenfield5 -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' -configuration Debug CODE_SIGNING_ALLOWED=NO > /tmp/ios-xcode-test.txt 2>&1
            rc=$?
          fi
          set -e
          cat /tmp/ios-xcode-test.txt
          if [ $rc -ne 0 ]; then
            tail -n 300 /tmp/ios-xcode-test.txt
            python3 - /tmp/ios-xcode-test.txt 'iOS xcode test' <<'PY'
          import sys; path,title=sys.argv[1],sys.argv[2]; data=open(path,'rb').read().decode('utf-8','replace')[-60000:]; enc=data.replace('%','%25').replace('\r','%0D').replace('\n','%0A'); t=title.replace('%','%25').replace(':','%3A').replace(',','%2C'); print(f'::error title={t}::{enc}')
          PY
            exit 1
          fi
          tail -n 200 /tmp/ios-xcode-test.txt
