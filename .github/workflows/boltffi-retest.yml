# Candidate-only CI for the BoltFFI patched retest (spikes/boltffi-retest).
#
# Deliberately a SEPARATE workflow from stack.yml: the production UniFFI control
# must keep publishing its own evidence regardless of what the candidate does,
# and a candidate failure must never be able to erase it.
#
# Every job here builds the BoltFFI CLI from an exact pinned commit. The RED
# step builds it UNPATCHED first, so the regression being fixed is demonstrated
# on this head with the same compiler command that then has to pass; the tracked
# patches are applied to the same checkout and the CLI is rebuilt from cache.
# Generated output is never edited by hand.
#
# Diagnostics contract: raw job logs are not always reachable from every
# environment, so every generation step captures its own log file, echoes the
# tail into the job output, and on failure emits an `::error` annotation whose
# message is the escaped log tail. A silent exit code is not an acceptable
# result for a failing candidate.
name: BoltFFI retest

on:
  pull_request:
    paths:
      - spikes/boltffi-retest/**
      - .github/workflows/boltffi-retest.yml
  push:
    branches: [main]
    paths:
      - spikes/boltffi-retest/**
      - .github/workflows/boltffi-retest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boltffi-retest-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.boltffi-target

jobs:
  candidate-rust:
    name: BoltFFI candidate Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spikes/boltffi-retest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Patch provenance
        run: bash scripts/fetch-patched-boltffi.sh --verify-only

      - name: Candidate contract tests
        run: cargo test --locked

      - name: Publish result
        if: always()
        run: |
          {
            echo "candidate-rust job status: ${{ job.status }}"
            echo "crate: greenfield5-bolt-spike (boltffi = \"=0.30.1\", same core sources by path)"
          } | python3 -c 'import sys; d=sys.stdin.read(); print("::notice title=BoltFFI candidate Rust::" + d.replace("%","%25").replace("\r","%0D").replace("\n","%0A")[:900])'

  candidate-android:
    name: BoltFFI candidate Android
    runs-on: ubuntu-latest
    # Release + debug Gradle phases, two instrumentation runs, and the
    # non-gating RED probe re-running both phases on the same emulator.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK, NDK and Rust targets
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'ndk;28.0.12916984' 'platform-tools'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12916984" >> "$GITHUB_ENV"
          # The spike pins its own toolchain (spikes/boltffi-retest/
          # rust-toolchain.toml), and `boltffi pack` compiles the crate from
          # there, so the cross targets must be installed for THAT toolchain -
          # not for whatever the runner's default happens to be.
          cd spikes/boltffi-retest
          rustup show active-toolchain || true
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Unpatched generator baseline (RED)
        run: |
          set -euo pipefail
          log=red-generation.log
          generate() {
            set -euo pipefail
            echo "== environment =="
            pwd
            rustc --version || true
            cargo --version || true
            rustup show active-toolchain || true
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --skip-patches
            cat .boltffi/rust-toolchain.toml || true
            # Build inside the checkout so its own rust-toolchain.toml applies;
            # the workspace pins a channel the runner's default may not satisfy.
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            "$cli" --version
            ( cd spikes/boltffi-retest \
              && "$cli" -v pack android --release --deny-skipped \
              && mv generated generated-unpatched )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (unpatched)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-unpatched.txt

      - name: RED assertion - the baseline is unpatched and its shape is published
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def emit(kind, title, body):
              body = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{kind} title={title}::{body[:900]}")

          root = pathlib.Path("spikes/boltffi-retest/generated-unpatched")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          if not files:
              emit("error", "BoltFFI RED baseline missing", f"nothing generated under {root}")
              sys.exit(1)
          emit("notice", "BoltFFI RED generated tree",
               "\n".join(f"{p.relative_to(root)} ({p.stat().st_size}B)" for p in files[:25]))
          kotlin = [p for p in files if p.suffix == ".kt"]
          shapes = []
          for path in kotlin[:4]:
              text = path.read_text()
              close = re.search(r"override fun close\(\) \{\n(.*?)\n    \}", text, re.S)
              shapes.append(
                  f"{path.relative_to(root)}: native_refs={text.count('Native.')} "
                  f"handle_refs={text.count('boltffiHandle')} "
                  f"closed_flag={'__boltffi_closed' in text} counter={'__boltffi_calls' in text}\n"
                  f"  close() body: {(close.group(1).strip() if close else '<no 4-space close()>')[:240]}"
              )
          emit("notice", "BoltFFI RED generated shapes", "\n".join(shapes) or "no .kt rendered")

          # Provenance gate only. A textual check cannot prove a race; it proves
          # which generator rendered this tree. The behavioural RED evidence is
          # the runtime probe below.
          text = "\n".join(p.read_text() for p in kotlin)
          problems = []
          if "boltffiRetain" in text:
              problems.append("baseline already contains boltffiRetain")
          if "__boltffi_calls" in text:
              problems.append("baseline already carries the #732 in-flight counter")
          if kotlin and "boltffiHandle" not in text:
              problems.append("baseline has no boltffiHandle accessor - generator shape changed, re-research before patching")
          if problems:
              emit("error", "BoltFFI RED baseline is not unpatched", "; ".join(problems))
              sys.exit(1)
          emit("notice", "BoltFFI RED baseline (provenance)",
               "unpatched v0.30.1 generated Kotlin: no in-flight counter and no retain/release guard "
               "(upstream #664); behavioural RED evidence comes from the runtime probe.")
          PY

      - name: Patched generator (GREEN)
        run: |
          set -euo pipefail
          log=green-generation.log
          generate() {
            set -euo pipefail
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --apply-only
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            ( cd spikes/boltffi-retest && "$cli" -v pack android --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (patched)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-patched.txt
          python3 - <<'PY'
          import hashlib, pathlib, re, sys

          def emit(kind, title, body):
              body = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{kind} title={title}::{body[:900]}")

          root = pathlib.Path("spikes/boltffi-retest/generated/kotlin")
          files = sorted(root.rglob("*.kt"))
          if not files:
              emit("error", "BoltFFI GREEN generation empty", f"no .kt under {root}")
              sys.exit(1)
          text = "\n".join(f.read_text() for f in files)
          retained = [ln.strip() for ln in text.splitlines() if "boltffiRetain" in ln or "boltffiRelease" in ln]
          emit("notice", "BoltFFI GREEN generated shapes",
               f"files={len(files)}\nretain/release lines:\n" + "\n".join(retained[:8]))
          problems = []
          for required in ("__boltffi_calls", "boltffiRetain()", "boltffiRelease()"):
              if required not in text:
                  problems.append(f"missing {required}")
          if "boltffiRetain().let" not in text:
              problems.append("stream subscribe sites not regenerated with the retain wrapper")
          leftover = re.findall(r"Native\.[A-Za-z_]+\([^)\n]*boltffiHandle\(\)", text)
          if leftover:
              problems.append(f"{len(leftover)} native call(s) still read boltffiHandle() directly")
          if problems:
              emit("error", "BoltFFI GREEN assertion failed", "; ".join(problems))
              sys.exit(1)
          for f in files:
              print("KOTLIN_SHA256", f.name, hashlib.sha256(f.read_bytes()).hexdigest())
          emit("notice", "BoltFFI GREEN generator",
               "patched v0.30.1 generated Kotlin carries the in-flight counter behind close()/boltffiRetain()/"
               "boltffiRelease() and retains the receiver across every stream subscribe.")
          PY

      - name: Publish patch provenance
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          lines = []
          for name in ("provenance-unpatched.txt", "provenance-patched.txt"):
              path = pathlib.Path(name)
              if not path.exists():
                  lines.append(f"{name}: MISSING")
                  continue
              for line in path.read_text(errors="replace").splitlines():
                  if line.startswith("BOLTFFI_"):
                      lines.append(line)
          text = " | ".join(lines)
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BoltFFI patch provenance::" + text[:900])
          PY

      - name: Android native proof on an emulator
        run: |
          set -euo pipefail
          log=native-proof.log
          set +e
          bash spikes/boltffi-retest/scripts/android-emulator-proof.sh >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Android native proof failed::${msg}"
            errors="$(grep -E 'error:|ERROR|PANIC|Fatal|Exception|cannot|not found|no such' "$log" | head -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Android native proof errors::${errors}"
            exit "$status"
          fi

      - name: RED probe - the unpatched generation under the same stress (non-gating)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          mv generated generated-patched
          mv generated-unpatched generated
          # The deterministic half of the RED/GREEN contrast. Swapping whole
          # generated trees and observing a crash is a *race*: run 35111780326 and
          # 35108329894 both hit the same post-close rejection in both trees, because
          # the unpatched template's check-then-act usually wins the check. The
          # contract difference is nevertheless exact and build-level: patch 0002
          # adds the in-flight counter (__boltffi_calls) and the retain/release pair
          # to the generated Kotlin, and the unpatched template has none of them -
          # every entry point reads boltffiHandle() directly.
          python3 - <<'PY'
          import pathlib, sys

          def tokens(tree):
              found = set()
              for path in pathlib.Path(tree).rglob("*.kt"):
                  text = path.read_text(errors="replace")
                  for token in ("__boltffi_calls", "boltffiRetain", "boltffiRelease", "boltffiHandle()"):
                      if token in text:
                          found.add(token)
              return found

          unpatched, patched = tokens("generated"), tokens("generated-patched")
          print("::notice title=BoltFFI Android contract shapes::"
                f"unpatched={sorted(unpatched)} patched={sorted(patched)}")
          missing = {"__boltffi_calls", "boltffiRetain", "boltffiRelease"} - patched
          if missing:
              sys.exit(f"patched tree is missing the in-flight counter: {sorted(missing)}")
          leaked = {"__boltffi_calls", "boltffiRetain", "boltffiRelease"} & unpatched
          if leaked:
              sys.exit(f"the unpatched tree already carries the counter: {sorted(leaked)}")
          PY
          set +e
          bash scripts/android-emulator-proof.sh red- >red-probe.log 2>&1
          status=$?
          set -e
          echo "RED_PROBE_EXIT=${status}"
          python3 - "$status" <<'PY'
          import pathlib, re, sys
          status = int(sys.argv[1])
          text = ""
          for path in sorted(list(pathlib.Path(".").glob("red-*.log"))
                             + list(pathlib.Path(".").glob("red-*-logcat.txt"))):
              text += f"[{path.name}]\n" + path.read_text(errors="replace")
          crash = [ln for ln in text.splitlines()
                   if re.search(r"FATAL EXCEPTION|SIGSEGV|Use after free|native crash|has died|JNI DETECTED ERROR|Fatal signal", ln, re.I)]
          marks = [ln for ln in text.splitlines()
                   if "BOLT_" in ln or "OK (1 test)" in ln or "FAILURES" in ln or "INSTRUMENTATION_FAILED" in ln]
          body = (f"unpatched generation under the same stress: exit={status}; "
                  f"crash-signals={len(crash)}; marker/result lines={len(marks)}\n"
                  + "\n".join((crash + marks)[:12]))
          print("::notice title=BoltFFI close-race RED probe::"
                + body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900])
          PY
          rm -rf generated
          mv generated-patched generated

      - name: Upload candidate Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boltffi-candidate-android
          path: |
            spikes/boltffi-retest/*-contract.log
            spikes/boltffi-retest/*-close.log
            spikes/boltffi-retest/emulator.log
            spikes/boltffi-retest/*-logcat.txt
            spikes/boltffi-retest/red-*.log
            spikes/boltffi-retest/red-*-logcat.txt
            red-generation.log
            green-generation.log
            native-proof.log
            provenance-unpatched.txt
            provenance-patched.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Android diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib

          def encode(lines):
              """One annotation body: %25-escaped, %0A-joined, capped per log."""
              return "%0A".join(ln.replace("%", "%25") for ln in lines)

          # One notice per log. The single concatenated notice this replaces kept only
          # its last ~900 characters, which cut off exactly the files that carried the
          # failure (run 35108329894: the close-race logs and the contract markers).
          logs = [
              "debug-contract.log", "debug-close.log", "release-contract.log",
              "release-close.log", "red-debug-close.log", "red-release-close.log",
              "native-proof.log", "emulator.log", "green-generation.log", "red-generation.log",
          ]
          keys = ("BOLT_", "OK (1 test)", "FAILURES", "INSTRUMENTATION_", "ANDROID_",
                  "error:", "ERROR", "PANIC", "Exception", "Use after free", "SIGSEGV",
                  "Unknown AVD", "ANDROID_NATIVE_PROOF",
                  # the frames are the attribution: a throw site inside the generated
                  # `boltffiRetain` guard is the patched rejection; a native frame is not
                  "at dev.greenfield5", "Caused by")
          missing = []
          for name in logs:
              path = pathlib.Path("spikes/boltffi-retest") / name
              if not path.exists():
                  path = pathlib.Path(name)
              if not path.exists():
                  missing.append(name)
                  continue
              data = path.read_text(errors="replace").splitlines()
              keep = [ln for ln in data if any(k in ln for k in keys)] or data[-10:]
              print("::notice title=BoltFFI Android " + name + "::" + encode(keep[-14:])[:900])
          if missing:
              print("::notice title=BoltFFI Android logs missing::" + ", ".join(missing))
          PY
  candidate-apple:
    name: BoltFFI candidate Apple
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apple Rust targets
        run: |
          set -euo pipefail
          # Install for the toolchain the spike actually pins, because `boltffi
          # pack apple` compiles the crate from spikes/boltffi-retest.
          cd spikes/boltffi-retest
          rustup show active-toolchain || true
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Unpatched generator baseline (RED)
        run: |
          set -euo pipefail
          log=red-generation.log
          generate() {
            set -euo pipefail
            echo "== environment =="
            pwd
            rustc --version || true
            cargo --version || true
            rustup show active-toolchain || true
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --skip-patches
            cat .boltffi/rust-toolchain.toml || true
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            "$cli" --version
            ( cd spikes/boltffi-retest && "$cli" -v pack apple --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (unpatched, apple)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-unpatched.txt

      - name: RED assertion - Swift 6 rejects the unpatched generated Swift
        run: |
          set -euo pipefail
          log=red-typecheck.log
          set +e
          bash spikes/boltffi-retest/scripts/swift-typecheck.sh spikes/boltffi-retest unpatched >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error title=BoltFFI Swift 6 RED not reproduced::the unpatched v0.30.1 generated Swift type-checked under -swift-version 6; the premise of patch 0001 must be re-researched."
            exit 1
          fi
          python3 - "$log" <<'PY'
          import re, sys
          
          def encode(lines):
              """One annotation body: %25-escaped, %0A-joined, so the reader sees newlines."""
              return "%0A".join(ln.replace("%", "%25") for ln in lines)
          
          report = open(sys.argv[1], errors="replace").read().splitlines()
          hits = [ln for ln in report if re.search(r"sendable", ln, re.I)]
          if len(hits) < 2:
              # Distinguish 'the probe found no generated Swift' from 'the compiler
              # failed for another reason': both fail the job, but only the second is a
              # statement about BoltFFI.
              harness = [ln for ln in report if ln.startswith("SWIFT_TYPECHECK_MISSING")]
              head = ("the probe found no generated Swift to compile" if harness
                      else "the unpatched generated Swift failed, but not with the non-Sendable diagnostics patch 0001 addresses")
              body = encode([head] + (harness or []) + report[-18:])
              print("::error title=BoltFFI Swift 6 RED was not the Sendable defect::" + body[:900])
              raise SystemExit(1)
          print("::notice title=BoltFFI Swift 6 RED (unpatched)::"
                + encode(["unpatched v0.30.1 rejected by -swift-version 6"] + hits[:6])[:900])
          PY
          mv spikes/boltffi-retest/generated spikes/boltffi-retest/generated-unpatched

      - name: Lifetime RED - the pre-0004 runtime frees the future too early
        run: |
          set -euo pipefail
          log=lifetime-red.log
          probe() {
            set -euo pipefail
            # Same generator, one fix removed: the Swift 6 compilation patch stays,
            # the future-lifetime patch does not.
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --apply-only --exclude 0004
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            ( cd spikes/boltffi-retest && "${CARGO_TARGET_DIR}/release/boltffi" -v pack apple --release --deny-skipped )
            bash spikes/boltffi-retest/scripts/apple-proof.sh lifetime
          }
          # `probe` turns errexit back on so the chain fails fast, and shell options
          # are global - so calling it directly here would kill this very step at the
          # first failing command. That is what happened in run 35102072270: the
          # probe's xcodebuild exited 65 while the log it had already written
          # recorded the lifetime violation, and the step died before the assertion
          # below could report it, skipping the entire GREEN phase. The subshell
          # contains the status.
          set +e
          ( probe ) >"$log" 2>&1
          status=$?
          set -e
          tail -n 60 "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error title=BoltFFI lifetime RED not reproduced::the pre-0004 runtime passed the lifetime probe, so the probe no longer covers the defect or patch 0004 has become redundant."
            exit 1
          fi
          python3 - "$log" <<'PY'
          import re, sys
          
          def encode(lines):
              return "%0A".join(ln.replace("%", "%25") for ln in lines)
          
          report = open(sys.argv[1], errors="replace").read().splitlines()
          hits = [ln.strip() for ln in report
                  if re.search(r"poll after free|double free|free inside a native|BOLT_LIFETIME", ln)]
          violation = any("poll after free" in ln or "double free" in ln or "free inside a native" in ln
                          for ln in hits)
          if not violation:
              # A failure that is not a recorded lifetime violation is a harness or build
              # result; say so instead of claiming the runtime was caught.
              print("::error title=BoltFFI lifetime RED failed for the wrong reason::"
                    + encode(["the probe failed without recording a lifetime violation"] + report[-16:])[:900])
              raise SystemExit(1)
          print("::notice title=BoltFFI lifetime RED (pre-0004)::"
                + encode(["pre-0004 generated runtime, model of the Rust future contract"] + hits[:12])[:900])
          PY
          rm -rf spikes/boltffi-retest/generated

      - name: Patched generator (GREEN)
        id: green
        run: |
          set -euo pipefail
          log=green-generation.log
          generate() {
            set -euo pipefail
            echo "== environment =="
            rustc --version || true
            cargo --version || true
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --apply-only
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            "$cli" --version
            ( cd spikes/boltffi-retest && "$cli" -v pack apple --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (patched, apple)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-patched.txt
          python3 - <<'PY'
          import hashlib, pathlib, sys

          def emit(kind, title, body):
              body = body.replace("%", "%25").replace("\\r", "%0D").replace("\\n", "%0A")
              print(f"::{kind} title={title}::{body[:900]}")

          root = pathlib.Path("spikes/boltffi-retest/generated")
          files = sorted(root.rglob("*.swift"))
          text = "\n".join(f.read_text() for f in files)
          sendable = text.count("@escaping @Sendable (RustFutureHandle?) -> Void")
          generic = text.count("func boltffiAsyncCall<T: Sendable>(")
          for f in files:
              print("SWIFT_SHA256", f.name, hashlib.sha256(f.read_bytes()).hexdigest())
          problems = []
          if sendable < 2:
              problems.append(f"{sendable} @Sendable cancel/free signatures, expected at least 2")
          if generic < 1:
              problems.append("generated call site does not constrain the completion value to Sendable")
          if "BoltFFIFutureLifetime" not in text:
              problems.append("generated runtime has no BoltFFIFutureLifetime owner (patch 0004 missing)")
          if "func freeOnQueue()" not in text:
              problems.append("the handle owner has no queue-confined, idempotent free")
          free_sites = text.count("freeHandle(handle)")
          if free_sites != 1:
              problems.append(f"{free_sites} freeHandle(handle) call sites, expected exactly 1, inside Owner.freeOnQueue")
          free_callers = text.count("owner.freeOnQueue()")
          if free_callers != 2:
              problems.append(f"{free_callers} owner.freeOnQueue() call sites, expected 2 (terminal step + deinit)")
          if "func terminal(" not in text:
              problems.append("the runtime has no terminal free-then-resume step")
          for stray in ("free(futureHandle)", "free(state.handle)", "free(lifetime.handle)",
                        "freeHandle(owner.handle)"):
              if stray in text:
                  problems.append(f"the generated runtime still frees the handle directly via {stray}")
          for required in ("DispatchQueue(label: \"boltffi.async.future\")", "queue.async(execute: body)",
                           "lifetime.terminal(cancel: cancel)"):
              if required not in text:
                  problems.append(f"generated runtime is missing {required}")
          if "deinit {" not in text:
              problems.append("the lifetime object has no deinit, so nothing frees the handle")
          if problems:
              emit("error", "BoltFFI GREEN assertion failed", "; ".join(problems))
              sys.exit(1)
          emit("notice", "BoltFFI GREEN generator",
               "patched v0.30.1 generated Swift: cancel/free are @escaping @Sendable, the completion value is "
               "constrained with T: Sendable, and the raw future handle is owned by BoltFFIFutureLifetime, which "
               "cancels, frees and only then resumes the caller - the free runs on the call's own queue, behind "
               "every native call, exactly once (Owner.freeOnQueue).")
          PY
          # The Swift 6 pair has to run on the same basis for both sides: the RED is
          # `swift-typecheck.sh ... unpatched`, so the GREEN is the same probe on the
          # patched output. Without this the pair was half-executed - the RED proved
          # the defect while the patched tree was only ever checked by text
          # assertions and by an app build that does not report the probe's own
          # invocation artifacts. A failure here is a candidate result, not a
          # harness defect: publish the compiler output and fail closed.
          bash spikes/boltffi-retest/scripts/swift-typecheck.sh spikes/boltffi-retest patched \
            >green-typecheck.log 2>&1 || {
            msg="$(tail -n 25 green-typecheck.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Swift 6 GREEN failed::${msg}"
            exit 1
          }
          grep -E "SWIFT_TYPECHECK_(FILE|patched_EXIT)" green-typecheck.log
          cp -R spikes/boltffi-retest/generated spikes/boltffi-retest/generated-patched

      - name: Lifetime GREEN - the patched runtime keeps the future alive
        run: |
          set -euo pipefail
          log=lifetime-green.log
          set +e
          bash spikes/boltffi-retest/scripts/apple-proof.sh lifetime >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI lifetime GREEN failed::${msg}"
            exit "$status"
          fi
          python3 - "$log" <<'PY'
          import sys
          
          def encode(lines):
              return "%0A".join(ln.replace("%", "%25") for ln in lines)
          
          report = open(sys.argv[1], errors="replace").read().splitlines()
          hits = [ln.strip() for ln in report if "BOLT_LIFETIME" in ln]
          print("::notice title=BoltFFI lifetime GREEN (patched)::"
                + encode(["patched runtime, same probe as the RED run"] + hits[:6])[:900])
          PY

      - name: 'Differential probe - is T: Sendable required? (non-gating)'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          # Start from the patched tree. The prep here still copied the *unpatched*
          # tree, so the token it looks for (`func boltffiAsyncCall<T: Sendable>(`,
          # which patch 0001 adds) was absent, the preparation exited non-zero, and
          # `continue-on-error: true` reported the step as a success with no result.
          # A non-gating probe must still be an executed probe.
          rm -rf generated
          cp -R generated-patched generated
          python3 - <<'PY'
          import pathlib, sys
          # Patched runtime with one token removed: is `T: Sendable` load-bearing on
          # top of the two @Sendable annotations, or is the constraint defensive?
          # The earlier form of this probe started from the *unpatched* tree, so it
          # also hit the probe's own top-level-code isolation artifacts and could not
          # attribute its failure. Starting from the patched tree isolates the token.
          target = "func boltffiAsyncCall<T: Sendable>("
          files = sorted(pathlib.Path("generated").rglob("*.swift"))
          if not files:
              sys.exit("no generated Swift for the differential probe")
          hits = 0
          for path in files:
              text = path.read_text()
              if target in text:
                  path.write_text(text.replace(target, "func boltffiAsyncCall<T>("))
                  hits += 1
          if hits != 1:
              sys.exit(f"expected exactly one boltffiAsyncCall declaration, found {hits}")
          print("::notice title=BoltFFI differential::patched runtime with `T: Sendable` removed from boltffiAsyncCall; everything else identical.")
          PY
          cd - >/dev/null
          set +e
          bash spikes/boltffi-retest/scripts/swift-typecheck.sh spikes/boltffi-retest partial >differential.log 2>&1
          status=$?
          set -e
          tail -n 20 differential.log
          python3 - "$status" <<'PY'
          import sys
          status = int(sys.argv[1])
          lines = open("differential.log", errors="replace").read().splitlines()
          evidence = [ln for ln in lines if "error:" in ln][:6]
          body = (f"patched runtime WITHOUT `T: Sendable` -> swiftc exit {status}; "
                  + ("the constraint is load-bearing - the generated call site does not compile without it"
                     if status != 0 else
                     "the constraint is NOT required at this pin, so patch 0001 must be narrowed to the two @Sendable annotations")
                  + "\n" + "\n".join(evidence))
          # Published once, by the diagnostics step: per-step notices compete for
          # the same annotation budget as the per-log evidence, and run 35111780326
          # lost both probe results that way.
          open("differential-summary.txt", "w").write(body)
          print(body)
          PY

      - name: Restore the patched generation
        # Only meaningful when the GREEN generation actually ran. `always()` on its
        # own made a *cancelled* job publish
        # "::error BoltFFI generation missing: generated-patched holds no generated
        # Swift" (run 35111696234: cancelled in the RED step by a newer head's run),
        # which reads like a generation defect instead of a cancellation.
        if: always() && steps.green.outcome == 'success'
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          # The apple pack writes generated/apple (+ generated/swift for the Swift API);
          # the GREEN step copies that whole tree aside, so any Swift source counts.
          if ! find generated-patched -name '*.swift' -print -quit | grep -q .; then
            echo "::error title=BoltFFI generation missing::generated-patched holds no generated Swift, so the GREEN generation step must have failed; the native test run cannot proceed."
            find generated-patched -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          rm -rf generated
          cp -R generated-patched generated

      - name: Patched generation unavailable
        if: always() && steps.green.outcome != 'success'
        run: |
          echo "::notice title=BoltFFI GREEN generation did not run::steps.green outcome='${{ steps.green.outcome }}' (cancelled, failed, or skipped): the native Xcode run has no patched sources to build, so it is NOT EXECUTED - not a pass."

      - name: Xcode build and native tests
        run: |
          set -euo pipefail
          log=xcode-test.log
          set +e
          bash spikes/boltffi-retest/scripts/apple-proof.sh test >"$log" 2>&1
          status=$?
          set -e
          tail -n 60 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Apple native proof failed::${msg}"
            errors="$(grep -E 'error:|XCTAssert|recorded an issue|failed|FAILED|BOLT_LIFETIME' "$log" | head -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Apple native proof errors::${errors}"
            exit "$status"
          fi
          python3 - "$log" <<'PY'
          import sys
          
          def encode(lines):
              return "%0A".join(ln.replace("%", "%25") for ln in lines)
          
          report = open(sys.argv[1], errors="replace").read().splitlines()
          keys = ("BOLT_PROOF", "BOLT_ERR", "BOLT_BACKLOG", "BOLT_BOUNDED", "BOLT_CANCEL",
                  "BOLT_LIFETIME", "Executed ", "Test run with")
          keep = [ln.strip() for ln in report if any(k in ln for k in keys)]
          print("::notice title=BoltFFI Apple native result::"
                + encode(["patched candidate, real Rust, real simulator"] + keep[-14:])[:900])
          PY

      - name: 'Sendable probe - class-returning async API (characterization, non-gating)'
        continue-on-error: true
        run: |
          set -euo pipefail
          log=sendable-probe.log
          probe() {
            set -euo pipefail
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            ( cd spikes/boltffi-retest/sendable-probe && "$cli" -v pack apple --release --deny-skipped )
            bash spikes/boltffi-retest/scripts/swift-typecheck.sh spikes/boltffi-retest/sendable-probe class-returning
          }
          set +e
          probe >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          python3 - "$status" <<'PY'
          import re, sys
          
          def encode(lines):
              return "%0A".join(ln.replace("%", "%25") for ln in lines)
          
          def emit(title, lines):
              # Written to a file as well: the diagnostics step publishes the probe
              # summaries in one notice, because per-step notices compete for the
              # same annotation budget and had already been dropped in run 35111780326.
              body = encode(lines)[:900]
              open("sendable-summary.txt", "w").write(title + "\\n" + body.replace("%0A", "\\n"))
              print(f"::notice title={title}::" + body)
          
          status = int(sys.argv[1])
          report = open("sendable-probe.log", errors="replace").read().splitlines()
          generated = [ln for ln in report if "SWIFT_TYPECHECK_FILE=" in ln]
          if not generated:
              # No generated Swift for this shape: a characterization result, not a
              # candidate failure. Say which reason it was.
              missing = [ln for ln in report if "SWIFT_TYPECHECK_MISSING" in ln]
              emit("BoltFFI Sendable probe: shape not offered at this pin",
                   ["the generator produced no Swift for an async API whose result is an exported class",
                    "(upstream main d5eba2e3 adds shared class handles as async *parameters*; a class result is a separate question)"]
                   + (missing or []) + report[-8:])
              raise SystemExit(0)
          sendable = [ln for ln in report if re.search(r"sendable|non-conforming|does not conform", ln, re.I)]
          errors = [ln for ln in report if "error:" in ln]
          if status == 0:
              emit("BoltFFI Sendable probe: PASS",
                   ["the generated Swift for an async class-returning API type-checks under -swift-version 6;",
                    "the T: Sendable constraint does not block this shape"] + generated[:2])
          else:
              emit("BoltFFI Sendable probe: class-handle boundary",
                   [f"swiftc exit {status}; the class-returning async API does not compile under Swift 6"]
                   + (sendable or errors)[:6])
          PY

      - name: Upload candidate Apple evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boltffi-candidate-apple
          path: |
            spikes/boltffi-retest/build.log
            spikes/boltffi-retest/test.log
            spikes/boltffi-retest/typecheck-*.log
            spikes/boltffi-retest/sendable-probe/typecheck-*.log
            red-generation.log
            green-generation.log
            red-typecheck.log
            lifetime-red.log
            lifetime-green.log
            differential.log
            sendable-probe.log
            provenance-unpatched.txt
            provenance-patched.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Apple diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re

          def encode(lines):
              return "%0A".join(ln.replace("%", "%25") for ln in lines)

          # Priority order, and only the first eight are published: annotations compete for
          # one per-run budget (run 35111780326 silently dropped both non-gating probe
          # results), so the deciding files come first and the probes get one shared notice.
          logs = [
              "xcode-test.log", "lifetime-green.log", "lifetime-red.log",
              "red-typecheck.log", "green-typecheck.log",
              "differential.log", "sendable-probe.log",
              "spikes/boltffi-retest/apple-test.log",
              "green-generation.log", "spikes/boltffi-retest/typecheck-unpatched.log",
              "spikes/boltffi-retest/typecheck-patched.log",
          ]
          pattern = (r"BOLT_|Executed [0-9]+ test|OK \(1 test\)|error:|VIOLATION|"
                     r"SWIFT_TYPECHECK|cannot find|Testing failed|No such file|"
                     r"failed|ANDROID_|INSTRUMENTATION")
          published, present, missing = [], [], []
          for name in logs:
              path = pathlib.Path(name)
              if not path.exists():
                  missing.append(name)
                  continue
              present.append(name)
              if len(published) >= 8:
                  continue
              lines = path.read_text(errors="replace").splitlines()
              keep = [ln for ln in lines if re.search(pattern, ln, re.I)] or lines[-12:]
              print("::notice title=BoltFFI Apple " + name + "::" + encode(keep[-14:])[:900])
              published.append(name)
          probes = []
          for name in ("differential-summary.txt", "sendable-summary.txt"):
              path = pathlib.Path(name)
              if path.exists():
                  probes.append(path.read_text(errors="replace").strip())
          if probes:
              print("::notice title=BoltFFI probes (non-gating)::"
                    + encode("\n".join(probes).splitlines())[:900])
          print("::notice title=BoltFFI Apple evidence files::present=" + ", ".join(present)
                + " | published=" + str(len(published)) + " | missing=" + ", ".join(missing))
          PY
