# Candidate-only CI for the BoltFFI patched retest (spikes/boltffi-retest).
#
# Deliberately a SEPARATE workflow from stack.yml: the production UniFFI control
# must keep publishing its own evidence regardless of what the candidate does,
# and a candidate failure must never be able to erase it.
#
# Every job here builds the BoltFFI CLI from an exact pinned commit. The RED
# step builds it UNPATCHED first, so the regression being fixed is demonstrated
# on this head with the same compiler command that then has to pass; the tracked
# patches are applied to the same checkout and the CLI is rebuilt from cache.
# Generated output is never edited by hand.
#
# Diagnostics contract: raw job logs are not always reachable from every
# environment, so every generation step captures its own log file, echoes the
# tail into the job output, and on failure emits an `::error` annotation whose
# message is the escaped log tail. A silent exit code is not an acceptable
# result for a failing candidate.
name: BoltFFI retest

on:
  pull_request:
    paths:
      - spikes/boltffi-retest/**
      - .github/workflows/boltffi-retest.yml
  push:
    branches: [main]
    paths:
      - spikes/boltffi-retest/**
      - .github/workflows/boltffi-retest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boltffi-retest-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.boltffi-target

jobs:
  candidate-rust:
    name: BoltFFI candidate Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/boltffi-retest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Patch provenance
        run: bash scripts/fetch-patched-boltffi.sh --verify-only

      - name: Candidate contract tests
        run: cargo test --locked

      - name: Publish result
        if: always()
        run: |
          {
            echo "candidate-rust job status: ${{ job.status }}"
            echo "crate: greenfield5-bolt-spike (boltffi = \"=0.30.1\", same core sources by path)"
          } | python3 -c 'import sys; d=sys.stdin.read(); print("::notice title=BoltFFI candidate Rust::" + d.replace("%","%25").replace("\r","%0D").replace("\n","%0A")[:900])'

  candidate-android:
    name: BoltFFI candidate Android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK, NDK and Rust targets
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'ndk;28.0.12916984' 'platform-tools'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12916984" >> "$GITHUB_ENV"
          # The spike pins its own toolchain (spikes/boltffi-retest/
          # rust-toolchain.toml), and `boltffi pack` compiles the crate from
          # there, so the cross targets must be installed for THAT toolchain -
          # not for whatever the runner's default happens to be.
          cd spikes/boltffi-retest
          rustup show active-toolchain || true
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Unpatched generator baseline (RED)
        run: |
          set -euo pipefail
          log=red-generation.log
          generate() {
            set -euo pipefail
            echo "== environment =="
            pwd
            rustc --version || true
            cargo --version || true
            rustup show active-toolchain || true
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --skip-patches
            cat .boltffi/rust-toolchain.toml || true
            # Build inside the checkout so its own rust-toolchain.toml applies;
            # the workspace pins a channel the runner's default may not satisfy.
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            "$cli" --version
            ( cd spikes/boltffi-retest \
              && "$cli" -v pack android --release --deny-skipped \
              && mv generated generated-unpatched )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (unpatched)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-unpatched.txt

      - name: RED assertion - the racy close shape is really present
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          files = list(pathlib.Path("spikes/boltffi-retest/generated-unpatched/kotlin").rglob("*.kt"))
          if not files:
              sys.exit("RED baseline produced no generated Kotlin")
          text = "\n".join(f.read_text() for f in files)
          if "boltffiRetain" in text:
              sys.exit("RED baseline unexpectedly already contains boltffiRetain")
          if "boltffiHandle" not in text:
              sys.exit("RED baseline is not the expected check-then-act generation")
          close = re.search(r"override fun close\(\) \{(.*?)\n    \}", text, re.S)
          if close is None or "Native." not in close.group(1):
              sys.exit("RED baseline close() does not call Native directly; wrong artifact")
          if not re.search(r"Native\.[A-Za-z_]+\([^)]*boltffiHandle\(\)", text):
              sys.exit("RED baseline has no Native call reading boltffiHandle() directly; wrong artifact")
          print("::notice title=BoltFFI RED baseline::unpatched v0.30.1 generated Kotlin frees through Native.<release>(handle) inside close(), passes boltffiHandle() straight into native calls, and has no in-flight counter (upstream #664).")
          PY

      - name: Patched generator (GREEN)
        run: |
          set -euo pipefail
          log=green-generation.log
          generate() {
            set -euo pipefail
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --apply-only
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            ( cd spikes/boltffi-retest && "$cli" -v pack android --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (patched)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-patched.txt
          python3 - <<'PY'
          import hashlib, pathlib, re, sys
          files = sorted(pathlib.Path("spikes/boltffi-retest/generated/kotlin").rglob("*.kt"))
          if not files:
              sys.exit("GREEN generation produced no Kotlin")
          text = "\n".join(f.read_text() for f in files)
          for required in ("__boltffi_calls", "boltffiRetain()", "boltffiRelease()"):
              if required not in text:
                  sys.exit(f"GREEN assertion failed: generated Kotlin lacks {required}")
          if "boltffiRetain().let" not in text:
              sys.exit("GREEN assertion failed: stream subscribe sites were not regenerated with the retain wrapper")
          leftover = re.findall(r"Native\.[A-Za-z_]+\([^)]*boltffiHandle\(\)", text)
          if leftover:
              sys.exit(f"GREEN assertion failed: {len(leftover)} native call(s) still read boltffiHandle() directly: {leftover[:3]}")
          for f in files:
              print("KOTLIN_SHA256", f.name, hashlib.sha256(f.read_bytes()).hexdigest())
          print("::notice title=BoltFFI GREEN generator::patched v0.30.1 generated Kotlin carries the in-flight counter behind close()/boltffiRetain()/boltffiRelease() and retains the receiver across every stream subscribe.")
          PY

      - name: Publish patch provenance
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          lines = []
          for name in ("provenance-unpatched.txt", "provenance-patched.txt"):
              path = pathlib.Path(name)
              if not path.exists():
                  lines.append(f"{name}: MISSING")
                  continue
              for line in path.read_text(errors="replace").splitlines():
                  if line.startswith("BOLTFFI_"):
                      lines.append(line)
          text = " | ".join(lines)
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BoltFFI patch provenance::" + text[:900])
          PY

      - name: Android native proof on an emulator
        run: |
          set -euo pipefail
          log=native-proof.log
          set +e
          bash spikes/boltffi-retest/scripts/android-emulator-proof.sh >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Android native proof failed::${msg}"
            exit "$status"
          fi

      - name: RED probe - the unpatched generation under the same stress (non-gating)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          rm -rf generated
          cp -R generated-unpatched generated
          set +e
          bash scripts/android-emulator-proof.sh red- >red-probe.log 2>&1
          status=$?
          set -e
          echo "RED_PROBE_EXIT=${status}"
          python3 - "$status" <<'PY'
          import pathlib, re, sys
          status = int(sys.argv[1])
          text = ""
          for name in ("red-probe.log", "red-contract.log", "red-close.log"):
              path = pathlib.Path(name)
              if path.exists():
                  text += f"[{name}]\n" + path.read_text(errors="replace")
          crash = [ln for ln in text.splitlines()
                   if re.search(r"FATAL EXCEPTION|SIGSEGV|Use after free|native crash|has died|JNI DETECTED ERROR|Fatal signal", ln, re.I)]
          marks = [ln for ln in text.splitlines()
                   if "BOLT_" in ln or "OK (1 test)" in ln or "FAILURES" in ln or "INSTRUMENTATION_FAILED" in ln]
          body = (f"unpatched generation under the same stress: exit={status}; "
                  f"crash-signals={len(crash)}; marker/result lines={len(marks)}\n"
                  + "\n".join((crash + marks)[:12]))
          print("::notice title=BoltFFI close-race RED probe::"
                + body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:900])
          PY
          rm -rf generated
          cp -R generated-patched generated 2>/dev/null || true

      - name: Upload candidate Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boltffi-candidate-android
          path: |
            spikes/boltffi-retest/contract.log
            spikes/boltffi-retest/close.log
            spikes/boltffi-retest/emulator.log
            spikes/boltffi-retest/CONTRACT-logcat.txt
            spikes/boltffi-retest/CLOSE-logcat.txt
            spikes/boltffi-retest/red-*.log
            spikes/boltffi-retest/red-*-logcat.txt
            red-generation.log
            green-generation.log
            native-proof.log
            provenance-unpatched.txt
            provenance-patched.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Android diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re
          parts = []
          for name in ("contract.log", "close.log", "emulator.log", "red-close.log",
                       "native-proof.log", "green-generation.log", "red-generation.log"):
              path = pathlib.Path("spikes/boltffi-retest") / name
              if not path.exists():
                  path = pathlib.Path(name)
              if not path.exists():
                  parts.append(f"[{name}: MISSING]")
                  continue
              data = path.read_text(errors="replace")
              keep = [ln for ln in data.splitlines()
                      if any(k in ln for k in ("BOLT_", "OK (1 test)", "FAILURES", "INSTRUMENTATION_",
                                               "ANDROID_", "error", "Exception", "Use after free", "SIGSEGV"))]
              parts.append(f"[{name}]\n" + "\n".join(keep[-40:]))
          text = "\n".join(parts)[-2400:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BoltFFI candidate Android result::" + text)
          PY

  candidate-apple:
    name: BoltFFI candidate Apple
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apple Rust targets
        run: |
          set -euo pipefail
          # Install for the toolchain the spike actually pins, because `boltffi
          # pack apple` compiles the crate from spikes/boltffi-retest.
          cd spikes/boltffi-retest
          rustup show active-toolchain || true
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Unpatched generator baseline (RED)
        run: |
          set -euo pipefail
          log=red-generation.log
          generate() {
            set -euo pipefail
            echo "== environment =="
            pwd
            rustc --version || true
            cargo --version || true
            rustup show active-toolchain || true
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --skip-patches
            cat .boltffi/rust-toolchain.toml || true
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            "$cli" --version
            ( cd spikes/boltffi-retest && "$cli" -v pack apple --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (unpatched, apple)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-unpatched.txt

      - name: RED assertion - the real project rejects the unpatched generated Swift
        run: |
          set -euo pipefail
          log=red-xcodebuild.log
          set +e
          bash spikes/boltffi-retest/scripts/apple-proof.sh red >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Swift 6 RED not reproduced::${msg}"
            exit "$status"
          fi
          mv spikes/boltffi-retest/generated spikes/boltffi-retest/generated-unpatched
          mv spikes/boltffi-retest/red-build.log . || true

      - name: Patched generator (GREEN)
        run: |
          set -euo pipefail
          log=green-generation.log
          generate() {
            set -euo pipefail
            bash spikes/boltffi-retest/scripts/fetch-patched-boltffi.sh --out .boltffi --apply-only
            ( cd .boltffi && cargo build --release -p boltffi_cli )
            cli="${CARGO_TARGET_DIR}/release/boltffi"
            ( cd spikes/boltffi-retest && "$cli" -v pack apple --release --deny-skipped )
          }
          set +e
          generate >"$log" 2>&1
          status=$?
          set -e
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI generation failed (patched, apple)::${msg}"
            exit "$status"
          fi
          cp "$log" provenance-patched.txt
          python3 - <<'PY'
          import hashlib, pathlib, sys
          sendable = 0
          generic = 0
          for f in sorted(pathlib.Path("spikes/boltffi-retest/generated").rglob("*.swift")):
              text = f.read_text()
              sendable += text.count("@escaping @Sendable (RustFutureHandle?) -> Void")
              generic += text.count("func boltffiAsyncCall<T: Sendable>(")
              print("SWIFT_SHA256", f.name, hashlib.sha256(f.read_bytes()).hexdigest())
          if sendable < 2:
              sys.exit(f"GREEN assertion failed: {sendable} Sendable cancel/free signatures, expected at least 2")
          if generic < 1:
              sys.exit("GREEN assertion failed: generated call site does not constrain the completion value to Sendable")
          print("::notice title=BoltFFI GREEN generator::patched v0.30.1 generated Swift declares cancel/free as @escaping @Sendable (RustFutureHandle?) -> Void and constrains the completion value with T: Sendable.")
          PY
          cp -R spikes/boltffi-retest/generated spikes/boltffi-retest/generated-patched

      - name: 'Differential probe - is T: Sendable required? (non-gating)'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          rm -rf generated
          cp -R generated-unpatched generated
          python3 - <<'PY'
          import pathlib, sys
          pairs = [
              ("    cancel: @escaping (RustFutureHandle?) -> Void,\n",
               "    cancel: @escaping @Sendable (RustFutureHandle?) -> Void,\n"),
              ("    free: @escaping (RustFutureHandle?) -> Void,\n",
               "    free: @escaping @Sendable (RustFutureHandle?) -> Void,\n"),
          ]
          files = sorted(pathlib.Path("generated").rglob("*.swift"))
          if not files:
              sys.exit("no generated Swift for the differential probe")
          for path in files:
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          print("::notice title=BoltFFI differential::parameters-only variant prepared: cancel/free are @Sendable but the completion value is not constrained to Sendable.")
          PY
          bash scripts/apple-proof.sh partial || true

      - name: Restore the patched generation
        if: always()
        run: |
          set -euo pipefail
          cd spikes/boltffi-retest
          if [ ! -d generated-patched/swift ]; then
            echo "::error title=BoltFFI generation missing::generated-patched/swift is absent, so the GREEN generation step must have failed; the native test run cannot proceed."
            exit 1
          fi
          rm -rf generated
          cp -R generated-patched generated

      - name: Xcode build and native tests
        run: |
          set -euo pipefail
          log=xcode-test.log
          set +e
          bash spikes/boltffi-retest/scripts/apple-proof.sh test >"$log" 2>&1
          status=$?
          set -e
          tail -n 40 "$log"
          if [ "$status" -ne 0 ]; then
            msg="$(tail -n 25 "$log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 900)"
            echo "::error title=BoltFFI Apple native proof failed::${msg}"
            exit "$status"
          fi

      - name: Upload candidate Apple evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boltffi-candidate-apple
          path: |
            spikes/boltffi-retest/build.log
            spikes/boltffi-retest/test.log
            red-build.log
            spikes/boltffi-retest/partial-build.log
            red-xcodebuild.log
            xcode-test.log
            red-generation.log
            green-generation.log
            provenance-unpatched.txt
            provenance-patched.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Apple diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          parts = []
          for name in ("red-build.log", "partial-build.log", "build.log", "test.log",
                       "red-xcodebuild.log", "xcode-test.log", "green-generation.log", "red-generation.log"):
              path = pathlib.Path("spikes/boltffi-retest") / name
              if not path.exists():
                  path = pathlib.Path(name)
              if not path.exists():
                  parts.append(f"[{name}: MISSING]")
                  continue
              data = path.read_text(errors="replace")
              keep = [ln for ln in data.splitlines()
                      if any(k in ln for k in ("error:", "BOLT_", "TEST SUCCEEDED", "TEST FAILED",
                                               "Executed ", "Test run with", "Test Case",
                                               "SWIFT_", "sendable", "Sendable"))]
              parts.append(f"[{name}]\n" + "\n".join(keep[-30:]))
          text = "\n".join(parts)[-2400:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=BoltFFI candidate Apple result::" + text)
          PY
