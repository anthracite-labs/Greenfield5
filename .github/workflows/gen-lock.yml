name: Generate Cargo.lock
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update
        required: true
        default: arena/01a0a1e4-greenfield5

permissions:
  contents: write

jobs:
  gen-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Generate Cargo.lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          ls -lh Cargo.lock
          wc -l Cargo.lock
          head -n 100 Cargo.lock

      - name: Commit Cargo.lock
        run: |
          set -euo pipefail
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to Cargo.lock"
            exit 0
          fi
          git commit -m "chore: commit core/Cargo.lock generated by Rust 1.98.1

Generated via cargo generate-lockfile on $(date -u) with toolchain $(rustc --version)
Pinned UniFFI 0.32.1 and thiserror 2 per ADR-0007"
          git push origin ${{ inputs.branch }}
