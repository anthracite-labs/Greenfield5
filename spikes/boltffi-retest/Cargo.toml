[package]
name = "greenfield5-bolt-spike"
version = "0.1.0"
edition = "2024"
publish = false

# The Sendable probe is a nested crate; it is generated and type-checked on its
# own and must never be packaged into the acceptance crate.
exclude = ["sendable-probe"]

[lib]
name = "greenfield5_bolt_spike"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
boltffi = "=0.30.1"
thiserror = "=2.0.20"
