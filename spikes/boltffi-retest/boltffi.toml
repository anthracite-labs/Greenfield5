[package]
name = "greenfield5-bolt-spike"
crate = "greenfield5_bolt_spike"
version = "0.1.0"

[targets.android]
min_sdk = 29
architectures = ["arm64", "x86_64"]
ndk_version = "28.0.12916984"
[targets.android.kotlin]
package = "dev.greenfield5.bolt"
output = "generated/kotlin"
[targets.android.kotlin.desktop_pack]
enabled = true
[targets.android.pack]
output = "generated/jniLibs"

[targets.apple]
deployment_target = "16.0"
include_macos = false
ios_architectures = ["arm64"]
simulator_architectures = ["arm64"]
output = "generated/apple"
[targets.apple.swift]
module_name = "BoltSpike"
output = "generated/swift"
[targets.apple.spm]
package_name = "BoltSpike"
layout = "ffi-only"
