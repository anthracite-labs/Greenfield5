# Focused probe crate (throwaway, spike-only): does BoltFFI's Swift backend offer
# an async API whose completion value is an exported class handle, and does the
# generated class satisfy the `T: Sendable` requirement that Swift 6 forces on
# `boltffiAsyncCall`? Kept separate from the acceptance crate so that a shape the
# generator rejects can never break the acceptance run.
[package]
name = "greenfield5-bolt-sendable-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "greenfield5_bolt_sendable_probe"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
boltffi = "=0.30.1"
